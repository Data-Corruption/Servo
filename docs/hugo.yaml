baseURL: https://servo.sproutcli.dev/
title: Servo
description: Dedicated game server manager, friend group sized.
enableRobotsTXT: true
publishDir: out
refLinksErrorLevel: ERROR
disableKinds: [taxonomy, term, RSS]

module:
  hugoVersion:
    extended: true
    min: 0.146.0
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
  tableOfContents:
    startLevel: 2
    endLevel: 2

menu:
  main:
    - name: Use Servo
      pageRef: /
      weight: 1
    - name: Caddy
      pageRef: /caddy
      weight: 2
    - name: Drivers
      pageRef: /drivers
      weight: 3

params:
  description: Dedicated game server manager, friend group sized.
  images: [images/social-card.jpg]
  theme:
    default: dark
    displayToggle: false
  search:
    enable: true
    type: flexsearch
  editURL:
    enable: false
  page:
    displayPagination: false
